<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Streaming Pro</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* === VARIABLES DE COLOR Y DISEÑO === */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333;
            --success-color: #03dac6;
            --danger-color: #cf6679;
            --info-color: #90caf9;
            --edit-color: #ffb74d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
        }

        header {
            background-color: var(--surface-color); padding: 15px 20px;
            border-bottom: 1px solid var(--border-color); text-align: center;
        }

        h1, h2, h3, h4 { color: var(--primary-color); margin-top: 0; }

        nav {
            display: flex; justify-content: center; flex-wrap: wrap;
            background-color: var(--surface-color); border-bottom: 1px solid var(--border-color);
        }

        nav button {
            background: none; border: none; color: var(--text-color);
            padding: 15px 20px; cursor: pointer; font-size: 1rem;
            border-bottom: 3px solid transparent; transition: 0.3s; flex-grow: 1; text-align: center;
        }

        nav button.active {
            border-bottom: 3px solid var(--primary-color); color: var(--primary-color);
        }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card {
            background-color: var(--surface-color); border-radius: 10px;
            padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-bottom: 20px;
        }

        /* === BUSCADOR === */
        .search-container {
            display: flex; align-items: center; background: var(--surface-color);
            border: 2px solid var(--border-color); border-radius: 25px;
            padding: 8px 15px; margin-bottom: 25px; transition: 0.3s;
        }
        .search-container:focus-within { border-color: var(--primary-color); }
        .search-container span { font-size: 1.2rem; margin-right: 10px; }
        .search-container input {
            background: none; border: none; color: var(--text-color);
            width: 100%; font-size: 1.1rem; outline: none;
        }

        /* === GRID DE LOGOS === */
        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px; margin-top: 15px;
        }

        .plat-card {
            background-color: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px 10px; text-align: center; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .plat-card:hover {
            transform: translateY(-5px); border-color: var(--primary-color);
            box-shadow: 0 6px 12px rgba(187, 134, 252, 0.2);
        }

        .plat-card img {
            width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; border-radius: 8px;
        }
        .plat-card h3 { color: var(--text-color); font-size: 1rem; margin: 0; }

        /* === FORMULARIOS === */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.95rem; color: #bbb; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 6px; background-color: var(--bg-color);
            color: var(--text-color); box-sizing: border-box; font-size: 1rem;
        }
        input:focus, select:focus { outline: 1px solid var(--primary-color); border-color: var(--primary-color); }

        /* === CHECKBOX TIPO SWITCH === */
        .switch-container {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.02); padding: 15px; border-radius: 8px;
            border: 1px solid var(--border-color); margin-bottom: 20px;
        }
        .switch-container label { margin: 0; color: var(--text-color); font-size: 1.1rem; }
        
        .switch { position: relative; display: inline-block; width: 54px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--success-color); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* === BOTONES === */
        button.btn {
            background-color: var(--primary-color); color: #000; border: none;
            padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;
            font-size: 1rem; width: 100%; transition: 0.2s;
        }
        button.btn:hover { opacity: 0.9; transform: scale(0.99); }
        button.btn-cancel { background-color: #555; color: #fff; margin-top: 10px; }
        button.btn-edit { background: var(--edit-color); color: #000; padding: 6px 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }

        /* === TABLAS (RESPONSIVAS) === */
        .table-wrapper { overflow-x: auto; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(255, 255, 255, 0.05); color: #aaa; text-transform: uppercase; font-size: 0.85rem; }
        tr:hover { background-color: rgba(255, 255, 255, 0.02); }

        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .status-in-stock { background-color: rgba(3, 218, 198, 0.2); color: var(--success-color); border: 1px solid var(--success-color); }
        .status-out-stock { background-color: rgba(207, 102, 121, 0.2); color: var(--danger-color); border: 1px solid var(--danger-color); }
        
        .cheapest-row { border-left: 4px solid var(--success-color); background-color: rgba(3, 218, 198, 0.03); }
        
        /* === ETIQUETAS DE PRECIOS === */
        .price-tag { color: var(--danger-color); font-weight: bold; font-size: 1.05rem; } /* Costo */
        .venta-tag { color: var(--info-color); font-weight: bold; font-size: 1.05rem; } /* Venta */
        .ganancia-tag { 
            color: var(--success-color); font-weight: bold; font-size: 1.15rem; 
            background: rgba(3, 218, 198, 0.15); padding: 4px 8px; border-radius: 6px;
        } /* Ganancia destacada */
        
        .seccion-titulo { border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 30px; display: flex; align-items: center; gap: 10px; }
        
        /* === NOTIFICACIÓN TOAST === */
        #toast {
            visibility: hidden; min-width: 250px; background-color: var(--success-color); color: #000;
            text-align: center; border-radius: 8px; padding: 15px; position: fixed; z-index: 1000;
            left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            opacity: 0; transition: opacity 0.4s, bottom 0.4s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

    </style>
</head>
<body>

    <header>
        <h1>Gestor de Proveedores</h1>
    </header>

    <nav>
        <button class="tab-btn active" onclick="openTab(event, 'dashboard')">🔍 Buscar Plataformas</button>
        <button class="tab-btn" onclick="openTab(event, 'gestion')">📦 Inventario</button>
    </nav>

    <div class="container">
        <!-- Pestaña: Dashboard de Logos -->
        <div id="dashboard" class="tab-content active">
            
            <div id="vistaGrid">
                <div class="search-container">
                    <span>🔍</span>
                    <input type="text" id="buscadorPlataformas" placeholder="Buscar plataforma por nombre..." onkeyup="filtrarPlataformas()">
                </div>
                
                <div class="logo-grid" id="plataformasGrid">
                    <!-- JS inyectará las tarjetas aquí -->
                </div>
                <p id="noResultsMsg" style="display:none; text-align:center; color:#888;">No se encontraron plataformas.</p>
            </div>

            <div id="vistaDetalles" style="display: none;">
                <button class="btn" style="width: auto; margin-bottom: 15px; background: #333; color: white;" onclick="volverGrid()">⬅ Volver atrás</button>
                
                <div class="card" style="border-top: 4px solid var(--primary-color);">
                    <h2 id="tituloPlataformaDetalle" style="margin: 0;">Detalles</h2>
                </div>

                <!-- Contenedor para Perfiles -->
                <div id="seccionPerfiles">
                    <h3 class="seccion-titulo">📱 Perfiles / Pantallas</h3>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Proveedor</th>
                                    <th>Costo</th>
                                    <th>Venta</th>
                                    <th>Ganancia</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="bodyPerfiles"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Contenedor para Cuentas Completas -->
                <div id="seccionCompletas">
                    <h3 class="seccion-titulo">📺 Cuentas Completas</h3>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Proveedor</th>
                                    <th>Costo</th>
                                    <th>Venta</th>
                                    <th>Ganancia</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="bodyCompletas"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pestaña: Gestión -->
        <div id="gestion" class="tab-content">
            <div class="card">
                <h2 id="formTitle">Agregar al Inventario</h2>
                <form id="formCuentas" onsubmit="saveCuenta(event)">
                    
                    <!-- Campo oculto para saber si editamos o creamos -->
                    <input type="hidden" id="cuentaId">

                    <div class="form-group">
                        <label>Proveedor</label>
                        <input list="listaProveedores" id="cProveedor" required placeholder="Escribe o selecciona...">
                        <datalist id="listaProveedores"></datalist>
                    </div>

                    <div class="form-group">
                        <label>Plataforma (Nombre exacto para agruparlas)</label>
                        <input type="text" id="cPlataforma" required placeholder="Ej. Netflix">
                    </div>

                    <div class="form-group">
                        <label>URL del Logo (Opcional)</label>
                        <input type="text" id="cLogo" placeholder="https://logo.clearbit.com/netflix.com">
                    </div>

                    <div class="form-group">
                        <label>Tipo de Venta</label>
                        <select id="cTipo" required>
                            <option value="Perfil">Perfil / Pantalla</option>
                            <option value="Completa">Cuenta Completa</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                        <div class="form-group" style="flex: 1; margin: 0;">
                            <label style="color: var(--danger-color);">Costo Proveedor ($)</label>
                            <input type="number" step="0.01" id="cPrecio" required placeholder="0.00">
                        </div>
                        <div class="form-group" style="flex: 1; margin: 0;">
                            <label style="color: var(--info-color);">Tú lo vendes a ($)</label>
                            <input type="number" step="0.01" id="cPrecioVenta" required placeholder="0.00">
                        </div>
                    </div>

                    <div class="switch-container">
                        <label for="cStock">¿Hay existencias disponibles?</label>
                        <label class="switch">
                            <input type="checkbox" id="cStock" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <button type="submit" class="btn" id="btnGuardarCuenta">Guardar Registro</button>
                    <button type="button" class="btn btn-cancel" id="btnCancelarEdicion" style="display:none;" onclick="cancelarEdicion()">Cancelar Edición</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Notificación Toast -->
    <div id="toast">¡Acción realizada con éxito!</div>

    <script>
        // === TUS CLAVES DE SUPABASE ===
        const SUPABASE_URL = 'https://jruxmtdzzlmdjqfhalks.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpydXhtdGR6emxtZGpxZmhhbGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MjIzMTgsImV4cCI6MjEwMjQ5ODMxOH0.2xZUo32s5lSh2qOPpjNklnbiNkszdeVQgENDLXECi4s';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let inventarioGlobal = [];

        // === CONTROL DE PESTAÑAS ===
        function openTab(event, tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            } else {
                const btns = document.querySelectorAll('.tab-btn');
                if(tabId === 'dashboard') btns[0].classList.add('active');
                if(tabId === 'gestion') btns[1].classList.add('active');
            }
        }

        // === NOTIFICACIÓN TOAST ===
        function mostrarToast(mensaje) {
            const toast = document.getElementById("toast");
            toast.innerText = mensaje;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // === CARGA DE DATOS ===
        async function fetchData() {
            const { data, error } = await supabaseClient.from('cuentas').select('*');
            if (error) {
                console.error("Error cargando datos:", error);
                return;
            }
            inventarioGlobal = data;
            actualizarDatalistProveedores();
            renderizarGridPlataformas();
        }

        function actualizarDatalistProveedores() {
            const proveedores = [...new Set(inventarioGlobal.map(c => c.proveedor))];
            const datalist = document.getElementById('listaProveedores');
            datalist.innerHTML = '';
            proveedores.forEach(prov => {
                const option = document.createElement('option');
                option.value = prov;
                datalist.appendChild(option);
            });
        }

        // === RENDERIZADO PRINCIPAL (CON ORDEN ALFABÉTICO) ===
        function renderizarGridPlataformas(filtro = "") {
            const grid = document.getElementById('plataformasGrid');
            const msg = document.getElementById('noResultsMsg');
            grid.innerHTML = '';

            const plataformasUnicas = {};
            inventarioGlobal.forEach(c => {
                if (!plataformasUnicas[c.plataforma]) {
                    plataformasUnicas[c.plataforma] = c.logo_url || 'https://via.placeholder.com/60?text=?';
                }
            });

            const nombresOrdenados = Object.keys(plataformasUnicas).sort((a, b) => a.localeCompare(b));
            let contador = 0;

            nombresOrdenados.forEach(platNombre => {
                if (platNombre.toLowerCase().includes(filtro.toLowerCase())) {
                    contador++;
                    const card = document.createElement('div');
                    card.className = 'plat-card';
                    card.onclick = () => verDetallesPlataforma(platNombre);
                    
                    card.innerHTML = `
                        <img src="${plataformasUnicas[platNombre]}" alt="${platNombre}">
                        <h3>${platNombre}</h3>
                    `;
                    grid.appendChild(card);
                }
            });

            msg.style.display = (contador === 0) ? "block" : "none";
        }

        function filtrarPlataformas() {
            const texto = document.getElementById('buscadorPlataformas').value;
            renderizarGridPlataformas(texto);
        }

        // === VISTA DE DETALLES ===
        function verDetallesPlataforma(nombrePlataforma) {
            document.getElementById('vistaGrid').style.display = 'none';
            document.getElementById('vistaDetalles').style.display = 'block';
            document.getElementById('tituloPlataformaDetalle').innerText = `Opciones para ${nombrePlataforma}`;

            const opciones = inventarioGlobal.filter(c => c.plataforma === nombrePlataforma);
            
            // Separar y ordenar (el costo más bajo primero)
            const perfiles = opciones.filter(c => c.tipo_cuenta === 'Perfil').sort((a, b) => a.precio - b.precio);
            const completas = opciones.filter(c => c.tipo_cuenta === 'Completa').sort((a, b) => a.precio - b.precio);

            const divPerfiles = document.getElementById('seccionPerfiles');
            const divCompletas = document.getElementById('seccionCompletas');
            const tbPerfiles = document.getElementById('bodyPerfiles');
            const tbCompletas = document.getElementById('bodyCompletas');
            
            tbPerfiles.innerHTML = '';
            tbCompletas.innerHTML = '';

            if (perfiles.length > 0) {
                divPerfiles.style.display = 'block';
                perfiles.forEach((c, index) => tbPerfiles.appendChild(crearFila(c, index)));
            } else {
                divPerfiles.style.display = 'none';
            }

            if (completas.length > 0) {
                divCompletas.style.display = 'block';
                completas.forEach((c, index) => tbCompletas.appendChild(crearFila(c, index)));
            } else {
                divCompletas.style.display = 'none';
            }
        }

        function crearFila(cuenta, index) {
            const tr = document.createElement('tr');
            if (index === 0 && cuenta.stock) tr.classList.add('cheapest-row');
            
            const precioVenta = cuenta.precio_venta ? cuenta.precio_venta : 0;
            // Cálculo automático de la ganancia
            const ganancia = precioVenta - cuenta.precio;
            
            tr.innerHTML = `
                <td><strong>${cuenta.proveedor}</strong> ${index === 0 && cuenta.stock ? '🏆' : ''}</td>
                <td><span class="price-tag">$${cuenta.precio.toFixed(2)}</span></td>
                <td><span class="venta-tag">$${precioVenta.toFixed(2)}</span></td>
                <td><span class="ganancia-tag">$${ganancia.toFixed(2)}</span></td>
                <td>
                    <span class="status-badge ${cuenta.stock ? 'status-in-stock' : 'status-out-stock'}">
                        ${cuenta.stock ? 'En Stock' : 'Agotado'}
                    </span>
                </td>
                <td>
                    <button class="btn-edit" onclick="editarCuenta('${cuenta.id}')">✏️ Editar</button>
                </td>
            `;
            return tr;
        }

        function volverGrid() {
            document.getElementById('vistaDetalles').style.display = 'none';
            document.getElementById('vistaGrid').style.display = 'block';
            document.getElementById('buscadorPlataformas').value = ""; 
            renderizarGridPlataformas();
        }

        // === LÓGICA DE EDICIÓN Y GUARDADO ===
        function editarCuenta(id) {
            const cuenta = inventarioGlobal.find(c => c.id === id);
            if(!cuenta) return;

            document.getElementById('cuentaId').value = cuenta.id;
            document.getElementById('cProveedor').value = cuenta.proveedor;
            document.getElementById('cPlataforma').value = cuenta.plataforma;
            document.getElementById('cLogo').value = cuenta.logo_url;
            document.getElementById('cTipo').value = cuenta.tipo_cuenta;
            document.getElementById('cPrecio').value = cuenta.precio;
            document.getElementById('cPrecioVenta').value = cuenta.precio_venta || 0;
            document.getElementById('cStock').checked = cuenta.stock;

            document.getElementById('formTitle').innerText = "Editar Registro";
            document.getElementById('btnGuardarCuenta').innerText = "💾 Actualizar Registro";
            document.getElementById('btnCancelarEdicion').style.display = "block";
            
            openTab(null, 'gestion');
        }

        function cancelarEdicion() {
            document.getElementById('formCuentas').reset();
            document.getElementById('cuentaId').value = '';
            document.getElementById('formTitle').innerText = "Agregar al Inventario";
            document.getElementById('btnGuardarCuenta').innerText = "Guardar Registro";
            document.getElementById('btnCancelarEdicion').style.display = "none";
        }

        async function saveCuenta(e) {
            e.preventDefault();
            
            const id = document.getElementById('cuentaId').value;
            const nuevaCuenta = {
                proveedor: document.getElementById('cProveedor').value.trim(),
                plataforma: document.getElementById('cPlataforma').value.trim(),
                logo_url: document.getElementById('cLogo').value.trim(),
                tipo_cuenta: document.getElementById('cTipo').value,
                precio: parseFloat(document.getElementById('cPrecio').value),
                precio_venta: parseFloat(document.getElementById('cPrecioVenta').value),
                stock: document.getElementById('cStock').checked
            };

            let response;
            
            if (id) {
                response = await supabaseClient.from('cuentas').update(nuevaCuenta).eq('id', id);
            } else {
                response = await supabaseClient.from('cuentas').insert([nuevaCuenta]);
            }

            if (response.error) {
                console.error(response.error);
                mostrarToast("❌ Error al guardar en base de datos");
            } else {
                cancelarEdicion(); 
                mostrarToast("✅ ¡Inventario guardado con éxito!");
                fetchData(); 
            }
        }

        window.onload = fetchData;
    </script>
</body>
</html>
