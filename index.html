<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Streaming</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* AQUI VAN TUS ESTILOS CSS */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333;
            --success-color: #03dac6;
            --danger-color: #cf6679;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
        }

        header {
            background-color: var(--surface-color); padding: 15px 20px;
            border-bottom: 1px solid var(--border-color); text-align: center;
        }

        h1, h2, h3 { color: var(--primary-color); }

        nav {
            display: flex; justify-content: center;
            background-color: var(--surface-color); border-bottom: 1px solid var(--border-color);
        }

        nav button {
            background: none; border: none; color: var(--text-color);
            padding: 15px 20px; cursor: pointer; font-size: 1rem;
            border-bottom: 3px solid transparent; transition: 0.3s;
        }

        nav button.active {
            border-bottom: 3px solid var(--primary-color); color: var(--primary-color);
        }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card {
            background-color: var(--surface-color); border-radius: 8px;
            padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Grid de Logos */
        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px; margin-top: 20px;
        }

        .plat-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px;
            text-align: center; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .plat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 6px 12px rgba(187, 134, 252, 0.2);
        }

        .plat-card img {
            width: 60px; height: 60px; object-fit: contain;
            margin-bottom: 10px; border-radius: 8px;
        }

        /* Formularios y Tablas */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 4px; background-color: var(--bg-color);
            color: var(--text-color); box-sizing: border-box;
        }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        button.btn {
            background-color: var(--primary-color); color: #000; border: none;
            padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(255, 255, 255, 0.05); }
        tr:hover { background-color: rgba(255, 255, 255, 0.02); }

        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .status-in-stock { background-color: var(--success-color); color: #000; }
        .status-out-stock { background-color: var(--danger-color); color: #fff; }
        .cheapest-row { border-left: 4px solid var(--success-color); background-color: rgba(3, 218, 198, 0.05); }
        .price-tag { font-weight: bold; color: var(--success-color); font-size: 1.1rem; }
        .tipo-tag { background-color: #444; padding: 3px 6px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>Gestor de Proveedores</h1>
    </header>

    <nav>
        <!-- Corregido: Ahora mandamos el 'event' directamente -->
        <button class="tab-btn active" onclick="openTab(event, 'dashboard')">Plataformas</button>
        <button class="tab-btn" onclick="openTab(event, 'gestion')">Agregar Inventario</button>
    </nav>

    <div class="container">
        <!-- Pestaña: Dashboard de Logos -->
        <div id="dashboard" class="tab-content active">
            
            <div id="vistaGrid">
                <h2>Selecciona una plataforma</h2>
                <div class="logo-grid" id="plataformasGrid">
                    <!-- JS inyectará las tarjetas aquí -->
                </div>
            </div>

            <div id="vistaDetalles" style="display: none;">
                <button class="btn" onclick="volverGrid()">⬅ Volver a Plataformas</button>
                <h2 id="tituloPlataformaDetalle" style="margin-top: 20px;">Detalles</h2>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>Proveedor</th>
                                <th>Tipo</th>
                                <th>Precio</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="detallesBody">
                            <!-- JS inyectará los proveedores aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Pestaña: Gestión -->
        <div id="gestion" class="tab-content">
            <div class="card">
                <h3>Agregar Nueva Plataforma</h3>
                <form id="formCuentas" onsubmit="saveCuenta(event)">
                    
                    <div class="form-group">
                        <label>Proveedor</label>
                        <input list="listaProveedores" id="cProveedor" required placeholder="Escribe o selecciona...">
                        <datalist id="listaProveedores"></datalist>
                    </div>

                    <div class="form-group">
                        <label>Plataforma (Nombre exacto para agruparlas)</label>
                        <input type="text" id="cPlataforma" required placeholder="Ej. Netflix">
                    </div>

                    <div class="form-group">
                        <label>URL del Logo (Opcional)</label>
                        <input type="text" id="cLogo" placeholder="Pega el link de la imagen aquí">
                    </div>

                    <div class="form-group">
                        <label>Tipo de Venta</label>
                        <select id="cTipo" required>
                            <option value="Perfil">Perfil / Pantalla</option>
                            <option value="Completa">Cuenta Completa</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Precio de Costo ($)</label>
                        <input type="number" step="0.01" id="cPrecio" required placeholder="0.00">
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="cStock" checked>
                        <label for="cStock" style="margin:0;">Hay existencias</label>
                    </div>

                    <button type="submit" class="btn" id="btnGuardarCuenta">Guardar Registro</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // AQUI VA TU JAVASCRIPT CORREGIDO
        const SUPABASE_URL = 'https://jruxmtdzzlmdjqfhalks.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpydXhtdGR6emxtZGpxZmhhbGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MjIzMTgsImV4cCI6MjEwMjQ5ODMxOH0.2xZUo32s5lSh2qOPpjNklnbiNkszdeVQgENDLXECi4s';

        // Renombramos la variable a supabaseClient por seguridad
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let inventarioGlobal = [];

        // Control de pestañas (Corregido para recibir el event)
        function openTab(event, tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Cargar datos al iniciar
        async function fetchData() {
            const { data, error } = await supabaseClient.from('cuentas').select('*');
            if (error) {
                console.error("Error cargando datos:", error);
                return;
            }
            inventarioGlobal = data;
            actualizarDatalistProveedores();
            renderizarGridPlataformas();
        }

        // Extraer proveedores únicos para el autocompletado
        function actualizarDatalistProveedores() {
            const proveedores = [...new Set(inventarioGlobal.map(c => c.proveedor))];
            const datalist = document.getElementById('listaProveedores');
            datalist.innerHTML = '';
            proveedores.forEach(prov => {
                const option = document.createElement('option');
                option.value = prov;
                datalist.appendChild(option);
            });
        }

        // Agrupar y dibujar las tarjetas del panel principal
        function renderizarGridPlataformas() {
            const grid = document.getElementById('plataformasGrid');
            grid.innerHTML = '';

            const plataformasUnicas = {};
            inventarioGlobal.forEach(c => {
                if (!plataformasUnicas[c.plataforma]) {
                    plataformasUnicas[c.plataforma] = c.logo_url || 'https://via.placeholder.com/60?text=?';
                }
            });

            Object.keys(plataformasUnicas).forEach(platNombre => {
                const card = document.createElement('div');
                card.className = 'plat-card';
                card.onclick = () => verDetallesPlataforma(platNombre);
                
                card.innerHTML = `
                    <img src="${plataformasUnicas[platNombre]}" alt="${platNombre}">
                    <h3>${platNombre}</h3>
                `;
                grid.appendChild(card);
            });
        }

        // Mostrar tabla de proveedores para una plataforma específica
        function verDetallesPlataforma(nombrePlataforma) {
            document.getElementById('vistaGrid').style.display = 'none';
            document.getElementById('vistaDetalles').style.display = 'block';
            document.getElementById('tituloPlataformaDetalle').innerText = `Opciones para: ${nombrePlataforma}`;

            const tbody = document.getElementById('detallesBody');
            tbody.innerHTML = '';

            const opciones = inventarioGlobal
                .filter(c => c.plataforma === nombrePlataforma)
                .sort((a, b) => a.precio - b.precio);

            opciones.forEach((c, index) => {
                const tr = document.createElement('tr');
                if (index === 0 && c.stock) {
                    tr.classList.add('cheapest-row');
                }
                
                tr.innerHTML = `
                    <td>${c.proveedor} ${index === 0 && c.stock ? '🏆' : ''}</td>
                    <td><span class="tipo-tag">${c.tipo_cuenta}</span></td>
                    <td class="price-tag">$${c.precio.toFixed(2)}</td>
                    <td>
                        <span class="status-badge ${c.stock ? 'status-in-stock' : 'status-out-stock'}">
                            ${c.stock ? 'Disponible' : 'Agotado'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Volver al panel de logos
        function volverGrid() {
            document.getElementById('vistaDetalles').style.display = 'none';
            document.getElementById('vistaGrid').style.display = 'block';
        }

        // Guardar nueva cuenta en Supabase
        async function saveCuenta(e) {
            e.preventDefault();
            
            const nuevaCuenta = {
                proveedor: document.getElementById('cProveedor').value.trim(),
                plataforma: document.getElementById('cPlataforma').value.trim(),
                logo_url: document.getElementById('cLogo').value.trim(),
                tipo_cuenta: document.getElementById('cTipo').value,
                precio: parseFloat(document.getElementById('cPrecio').value),
                stock: document.getElementById('cStock').checked
            };

            const { data, error } = await supabaseClient.from('cuentas').insert([nuevaCuenta]);

            if (error) {
                alert("Error al guardar en la base de datos.");
                console.error(error);
            } else {
                document.getElementById('formCuentas').reset();
                alert("Guardado correctamente");
                fetchData(); 
            }
        }

        // Inicializar app
        window.onload = fetchData;
    </script>
</body>
</html>
